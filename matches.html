<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛程比分 · 每日体坛速览</title>
  <script>
    // 防闪烁：在样式表加载前就定好深浅（与首页共用同一键，跨页同步）
    document.documentElement.dataset.theme = localStorage.getItem('hot-theme') === 'light' ? 'light' : 'dark';
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="tag">28days 项目 · MVP</span>
      <h1>赛程比分</h1>
      <p class="meta">
        <span id="today"></span>
        <span>数据最近更新时间 <b id="updated-at">--</b></span>
      </p>
    </div>
    <nav class="site-nav" aria-label="主导航">
      <div class="nav-pages">
        <a href="index.html" class="nav-link">热搜速览</a>
        <a href="matches.html" class="nav-link active">赛程比分</a>
        <a href="news.html?cat=足球" class="nav-link">资讯</a>
        <a href="league.html?lg=nba" class="nav-link">NBA</a>
        <a href="league.html?lg=cba" class="nav-link">CBA</a>
        <a href="league.html?lg=ucl" class="nav-link">欧冠</a>
        <a href="league.html?lg=epl" class="nav-link">英超</a>
      </div>
      <div class="nav-filters" id="nav-filters" aria-label="大类筛选">
        <button type="button" class="filter-btn" data-category="篮球">篮球</button>
        <button type="button" class="filter-btn" data-category="足球">足球</button>
        <button type="button" class="filter-btn" data-category="综合">综合</button>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深浅模式">☀️</button>
    </nav>
  </header>

  <main id="matches-main">
    <div class="date-switch" id="date-switch" aria-label="日期切换">
      <button type="button" class="date-btn" data-offset="-1">昨天</button>
      <button type="button" class="date-btn active" data-offset="0">今天</button>
      <button type="button" class="date-btn" data-offset="1">明天</button>
    </div>

    <!-- 搜索与筛选（Day 12）：关键词搜索 + 联赛（平台）筛选 -->
    <section class="search-bar" aria-label="搜索与筛选">
      <div class="search-input-wrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="search-input" type="search" class="search-input"
               placeholder="搜索球队或联赛，如：湖人 / 英超"
               aria-label="关键词搜索" autocomplete="off">
        <button id="search-clear" class="search-clear" type="button"
                aria-label="清空搜索" title="清空搜索" hidden>✕</button>
      </div>
      <div class="platform-filters" id="platform-filters" role="group" aria-label="联赛筛选">
        <button type="button" class="platform-btn active" data-platform="" aria-pressed="true">全部</button>
        <button type="button" class="platform-btn" data-platform="NBA" aria-pressed="false">NBA</button>
        <button type="button" class="platform-btn" data-platform="CBA" aria-pressed="false">CBA</button>
        <button type="button" class="platform-btn" data-platform="英超" aria-pressed="false">英超</button>
        <button type="button" class="platform-btn" data-platform="中超" aria-pressed="false">中超</button>
        <button type="button" class="platform-btn" data-platform="欧冠" aria-pressed="false">欧冠</button>
      </div>
    </section>

    <p class="matches-meta" id="matches-date-label">加载中…</p>
    <div id="match-list" aria-live="polite">
      <p class="empty-hint">加载中…</p>
    </div>
  </main>

  <footer class="site-footer">
    <p><b>内容来源说明</b>：比分数据以官方结果为准，仅展示结果数据，发现错误当日更正并留痕。</p>
    <p>每日体坛速览 · 28days 练习项目 · MVP 阶段覆盖 NBA、英超两个联赛，真实数据源将在第 2 周接入。</p>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/matches.js"></script>
</body>
</html>
