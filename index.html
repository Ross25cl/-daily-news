<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日资讯速览</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      max-width: 680px;
      margin: 48px auto;
      padding: 0 24px;
      color: #222;
    }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .date { color: #667; font-size: 14px; margin-bottom: 24px; }
    .item {
      padding: 14px 16px;
      border: 1px solid #e3e3e3;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .item h2 { font-size: 16px; margin: 0 0 6px; }
    .item p { margin: 0; color: #556; font-size: 14px; line-height: 1.6; }
    .tag {
      display: inline-block;
      background: #eef6ee;
      color: #2c6e2c;
      border-radius: 6px;
      padding: 2px 10px;
      font-size: 12px;
    }
    footer { margin-top: 32px; color: #99a; font-size: 13px; }
  </style>
</head>
<body>
  <span class="tag">28days 项目 · v1</span>
  <h1>每日资讯速览</h1>
  <p class="date" id="today"></p>

  <div class="item">
    <h2>（占位）今日要闻一</h2>
    <p>这里以后展示摘要。数据源接入后自动更新。</p>
  </div>
  <div class="item">
    <h2>（占位）今日要闻二</h2>
    <p>这里以后展示摘要。数据源接入后自动更新。</p>
  </div>
  <div class="item">
    <h2>（占位）今日要闻三</h2>
    <p>这里以后展示摘要。数据源接入后自动更新。</p>
  </div>

  <footer>第一版：静态占位页面，新闻数据源将在后续版本接入。</footer>

  <script>
    document.getElementById('today').textContent =
      new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  </script>
</body>
</html>
