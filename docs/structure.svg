<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 492" width="100%" role="img">
  <title>每日体坛速览项目结构图</title>
  <desc>页面层两个 HTML 入口，经逻辑层两个 JS 渲染脚本读取数据层两个 JSON 文件，共用一份样式表，文档区收纳五份文档与数据流图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="14" font-weight="500" fill="#444441">每日体坛速览 · 项目结构（Day 7 MVP）</text>

  <text x="40" y="92" font-size="12" fill="#888780">页面层（入口）</text>
  <g>
    <rect x="90" y="104" width="220" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="200" y="126" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A">index.html</text>
    <text x="200" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">每日速览页（P1）</text>
  </g>
  <g>
    <rect x="370" y="104" width="220" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="480" y="126" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A">matches.html</text>
    <text x="480" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">赛程比分页（P2）</text>
  </g>

  <text x="40" y="202" font-size="12" fill="#888780">逻辑层（渲染脚本）</text>
  <g>
    <rect x="105" y="214" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="200" y="236" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">js/app.js</text>
    <text x="200" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">四板块渲染 + 大类筛选</text>
  </g>
  <g>
    <rect x="285" y="214" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">css/style.css</text>
    <text x="340" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">共用样式</text>
  </g>
  <g>
    <rect x="385" y="214" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="480" y="236" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">js/matches.js</text>
    <text x="480" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">日期切换 + 比赛卡片</text>
  </g>

  <text x="40" y="312" font-size="12" fill="#888780">数据层（JSON 文件即数据库）</text>
  <g>
    <rect x="105" y="324" width="190" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="200" y="346" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">data/news.json</text>
    <text x="200" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">速览条目 · 8 条示例</text>
  </g>
  <g>
    <rect x="385" y="324" width="190" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="480" y="346" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">data/matches.json</text>
    <text x="480" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">比赛数据 · 4 场示例</text>
  </g>

  <path d="M200 160 L200 208" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="208" y="186" font-size="11" fill="#888780">script 引入</text>
  <path d="M480 160 L480 208" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="488" y="186" font-size="11" fill="#888780">script 引入</text>

  <path d="M322 214 L272 166" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M358 214 L408 166" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="340" y="292" text-anchor="middle" font-size="11" fill="#888780">样式作用于两页</text>

  <path d="M200 270 L200 318" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="208" y="296" font-size="11" fill="#888780">fetch 读取</text>
  <path d="M480 270 L480 318" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="488" y="296" font-size="11" fill="#888780">fetch 读取</text>

  <rect x="40" y="428" width="600" height="44" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="450" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">文档区：README.md · research.md · PRD.md · TECH_DESIGN.md · AGENTS.md · docs/dataflow.svg（数据流图）</text>
</svg>
