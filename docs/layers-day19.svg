<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>每日体坛速览 · 后端分层示意图（Day 19）</title>
<desc>接口层只负责接请求、调函数、返响应；数据访问层按业务表分文件，集中所有数据库查询；连接底座处理如何连库。分层后改查库不再需要动接口文件。</desc>
<defs>
<marker id="a19" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="34" text-anchor="middle" font-family="system-ui,-apple-system,'Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">每日体坛速览 · 后端分层示意图（Day 19）</text>
<text x="340" y="56" text-anchor="middle" font-family="system-ui,-apple-system,'Microsoft YaHei',sans-serif" font-size="12" fill="#5F5E5A">分层的收益：改「查数据库」只动数据访问层，接口文件不再复述表结构</text>

<g font-family="system-ui,-apple-system,'Microsoft YaHei',sans-serif">

<!-- ===== 第一层：接口层 ===== -->
<rect x="40" y="78" width="600" height="150" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="100" font-size="13" font-weight="500" fill="#0C447C">① 接口层 · cloudfunctions/&lt;函数&gt;/index.js</text>
<text x="56" y="118" font-size="11.5" fill="#185FA5">职责：路由 / 方法分支 · 入参校验 · 状态码与错误码 · 响应包络 · 日志</text>

<rect x="60" y="130" width="270" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="76" y="150" font-size="12.5" font-weight="500" fill="#0C447C">api / index.js</text>
<text x="76" y="169" font-size="11.5" fill="#185FA5">GET /api/hot</text>
<text x="76" y="187" font-size="11" fill="#5F5E5A">参数校验 → 调 repository</text>
<text x="76" y="203" font-size="11" fill="#5F5E5A">→ 组装响应。零 SQL 字面量。</text>

<rect x="350" y="130" width="270" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="366" y="150" font-size="12.5" font-weight="500" fill="#0C447C">favorites / index.js</text>
<text x="366" y="169" font-size="11.5" fill="#185FA5">POST + GET /api/favorites</text>
<text x="366" y="187" font-size="11" fill="#5F5E5A">校验 + 防重流程 → 调 repository</text>
<text x="366" y="203" font-size="11" fill="#5F5E5A">→ 组装响应。不碰表名列名。</text>

<!-- ===== 第二层：数据访问层 ===== -->
<rect x="40" y="250" width="600" height="150" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="56" y="272" font-size="13" font-weight="500" fill="#085041">② 数据访问层 · cloudfunctions/shared/*Repository.js</text>
<text x="56" y="290" font-size="11.5" fill="#0F6E56">职责：表名 / 列名（白名单常量） · 查询条件 · 行↔字段映射（snake_case↔camelCase） · 主键规则</text>

<rect x="60" y="302" width="270" height="80" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="76" y="322" font-size="12.5" font-weight="500" fill="#085041">hotItemsRepository.js</text>
<text x="76" y="341" font-size="11.5" fill="#0F6E56">表 hot_items</text>
<text x="76" y="359" font-size="11" fill="#5F5E5A">findByPlatform(p, limit)</text>
<text x="76" y="375" font-size="11" fill="#5F5E5A">toItemJSON(row)</text>

<rect x="350" y="302" width="270" height="80" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="366" y="322" font-size="12.5" font-weight="500" fill="#085041">newsItemsRepository.js</text>
<text x="366" y="341" font-size="11.5" fill="#0F6E56">表 news_items</text>
<text x="366" y="359" font-size="11" fill="#5F5E5A">findBySourceUrl · countByDigestDate</text>
<text x="366" y="375" font-size="11" fill="#5F5E5A">listRecent · insert · toJSON · makeId</text>

<!-- ===== 第三层：连接底座 ===== -->
<rect x="40" y="422" width="600" height="66" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="444" font-size="13" font-weight="500" fill="#633806">③ 连接底座 · cloudfunctions/shared/pg.js</text>
<text x="56" y="462" font-size="11.5" fill="#854F0B">职责：怎么连库 —— 环境变量 / API Key · HTTPS 请求 · 超时与错误包装。不认识任何业务表。</text>
<text x="56" y="479" font-size="11" fill="#5F5E5A">selectRows(table, query) · insertRow(table, row) · connectionInfo()</text>

<!-- ===== 外部依赖 ===== -->
<rect x="180" y="510" width="320" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="340" y="530" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">CloudBase PG 的 HTTP API（PostgREST，走 https）</text>
</g>

<g fill="none" stroke="#5F5E5A" stroke-width="1.5">
<path d="M195,210 L195,296" marker-end="url(#a19)"/>
<path d="M485,210 L485,296" marker-end="url(#a19)"/>
<path d="M195,382 L195,416" marker-end="url(#a19)"/>
<path d="M485,382 L485,416" marker-end="url(#a19)"/>
<path d="M340,488 L340,504" marker-end="url(#a19)"/>
</g>
<g font-family="system-ui,-apple-system,'Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A">
<text x="203" y="258">调 repository</text>
<text x="493" y="258">调 repository</text>
<text x="203" y="404">selectRows / insertRow</text>
<text x="493" y="404">selectRows / insertRow</text>
<text x="350" y="501">HTTPS</text>
</g>
</svg>
